    <!--___________ Блок основної інформації. ---------------------->

    <div class="album py-5 bg-body-tertiary" id="recipesBlock">
        <div class="container">
            <!-- Новий рядок -->
            <div class="row">
                <!-- Новий елемент -->
                <div th:each="recipe : ${recipes}" class="col-md-4">
                    <div class="card mb-4 shadow-sm">
                        <img th:src="@{'/images' + ${recipe.imageFileName}}"
                             alt="..." width="225" height="225" class="center"/>
                        <div class="card-body">
                            <p th:text="${recipe.getDishName()}" class="card-text">
                            </p>
                            <div
                                    class="d-flex justify-content-between align-items-center"
                            >
                                <div class="btn-group">
                                    <a
                                            type="button"
                                            class="btn btn-sm btn-outline-secondary"
                                            th:href="@{/recipes/details(id=${recipe.id})}"
                                    >
                                        Детальніше
                                    </a>
                                    <a
                                            type="button"
                                            class="btn btn-sm btn-outline-success"
                                            th:href="@{/recipes/addToFavorites(id=${recipe.id})}"
                                            id = "add"
                                    >
                                        В обрані
                                    </a>
                                </div>
                                <small th:text="${recipe.getCalories()} + ккал." class="text-muted"></small>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
