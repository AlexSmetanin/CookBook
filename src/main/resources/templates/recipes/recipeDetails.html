<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CookBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>

<body>

<!-- ================================================== -->
<!--------------- Блок меню навігації. ----------------->
<header data-bs-theme="dark">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <a class="navbar-brand" href="/">CookBook</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/">Головна</a>
                </li>
            </ul>
        </div>
    </nav>
</header>
<!-- ================================================== -->

<div class="container">
    <div class="col-md-8 mx-auto rounded border p-4 m-4">
        <h2 class="text-center mb-5">Детальніше Про Рецепт</h2>

        <form method="get" enctype="multipart/form-data" th:object="${recipe}">

            <div class="row mb-3">
                <div class="offset-sm-4 col-sm-8">
                    <img th:src="@{'/images' + ${recipe.imageFileName}}"
                         alt="..." width="300" class="center">
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-4 col-form-label">Назва</label>
                <div class="col-sm-8">
                    <input readonly class="form-control" th:field="${recipe.dishName}">
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-4 col-form-label">Категорія</label>
                <div class="col-sm-8">
                    <input readonly class="form-control" th:field="${recipe.category}">
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-4 col-form-label">Опис</label>
                <div class="col-sm-8">
                    <textarea readonly class="form-control" th:field="${recipe.description}" rows="2"></textarea>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-4 col-form-label">Інгредієнти</label>
                <div class="col-sm-8">
                    <textarea readonly class="form-control" th:field="${recipe.ingredients}" rows="4"></textarea>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-4 col-form-label">Інструкція</label>
                <div class="col-sm-8">
                    <textarea readonly class="form-control" th:field="${recipe.instruction}" rows="5"></textarea>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-4 col-form-label">Калорійність</label>
                <div class="col-sm-8">
                    <input readonly class="form-control" th:field="${recipe.calories}">
                </div>
            </div>

            <div class="row">
                <div class="offset-sm-4 col-sm-4 d-grid">
                    <a id="print" type="button" class="btn btn-primary" th:href="@{/recipes/printRecipe(id=${recipe.id})}">Друкувати</a>
                </div>
                <div class="col-sm-4 d-grid">
                    <a class="btn btn-outline-primary" href="/" role="button">Відмінити</a>
                </div>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.min.js" integrity="sha384-RuyvpeZCxMJCqVUGFI0Do1mQrods/hhxYlcVfGPOfQtPJh0JCw12tUAZ/Mv10S7D" crossorigin="anonymous"></script>

</body>
</html>
