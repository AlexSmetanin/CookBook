<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clean Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-md bg-dark navbar-dark">
  <!-- Brand -->
  <a class="navbar-brand" href="#">Адміністратор Сайту</a>

  <!-- Toggler/collapsibe Button -->
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
    <span class="navbar-toggler-icon"></span>
  </button>

  <!-- Navbar links -->
  <div class="collapse navbar-collapse" id="collapsibleNavbar">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" th:href="@{/static}">Головна</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" th:href="@{/recipes}">Рецепти</a>
      </li>
    </ul>
  </div>
</nav>

<div class="container">
  <h1 class="text-center my-4">Рецепти</h1>

  <a class="btn btn-primary" href="/recipes/create">Новий Рецепт</a>

  <table class="table">
    <thead>
    <tr>
      <th>ID</th>
      <th>Назва</th>
      <th>Категорія</th>
      <th>Опис</th>
      <th>Зображення</th>
      <th>Дія</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="recipe : ${recipes}">
      <td th:text="${recipe.id}"></td>
      <td th:text="${recipe.dishName}"></td>
      <td th:text="${recipe.category}"></td>
      <td th:text="@{${recipe.description}}"></td>
      <td><img th:src="@{'/images' + ${recipe.imageFileName}}"
               alt="..." width="100">
      </td>
      <td style="white-space: nowrap">
        <a class="btn btn-primary btn-sm"
           th:href="@{/recipes/edit(id=${recipe.id})}">Змінити</a>
        <a class="btn btn-danger btn-sm"
           th:href="@{/recipes/delete(id=${recipe.id})}"
           onclick="return confirm('Ви впевнені?')">Видалити</a>
      </td>
    </tr>
    </tbody>
  </table>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.min.js" integrity="sha384-RuyvpeZCxMJCqVUGFI0Do1mQrods/hhxYlcVfGPOfQtPJh0JCw12tUAZ/Mv10S7D" crossorigin="anonymous"></script>
</body>
</html>
